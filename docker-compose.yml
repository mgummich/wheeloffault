services:
  schuldrad:
    profiles: ['sqlite']
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - schuldrad-data:/data
    # Optional single-password protection (server mode only, off by
    # default). Uncomment to require SCHULDRAD_PASSWORD before any team
    # data is reachable — see docs/en/deployment.md § 3a and SECURITY.md.
    # Prefer a Docker secret over a plain env var so the password does not
    # end up in `docker inspect` output:
    # secrets:
    #   - schuldrad_password
    # environment:
    #   SCHULDRAD_PASSWORD_FILE: /run/secrets/schuldrad_password

  schuldrad-overengineered:
    profiles: ['overengineered']
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      EVENT_STORE: postgres
      DATABASE_URL: postgres://schuldrad:schuldrad@postgres:5432/schuldrad
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    profiles: ['overengineered']
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schuldrad
      POSTGRES_USER: schuldrad
      POSTGRES_PASSWORD: schuldrad
    volumes:
      - schuldrad-postgres:/var/lib/postgresql/data

  redis:
    profiles: ['overengineered']
    image: redis:7-alpine

volumes:
  schuldrad-data:
  schuldrad-postgres:

# secrets:
#   schuldrad_password:
#     file: ./schuldrad_password.txt
