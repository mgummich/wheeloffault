name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Postgres/Redis service containers, same images as docker-compose.yml's
    # `overengineered` profile: real coverage for postgresEventStore.ts and
    # the Redis broadcast hub, which the SQLite-only unit tests can't reach.
    # Health-checked so `test:integration` never races a container that
    # hasn't finished starting. Extending `verify` rather than adding a new
    # job: it already runs `test:integration`, and the new Postgres/Redis
    # tests skip themselves via DATABASE_URL/REDIS_URL, so nothing but the
    # service block and two env vars needs to change.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schuldrad
          POSTGRES_USER: schuldrad
          POSTGRES_PASSWORD: schuldrad
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://schuldrad:schuldrad@localhost:5432/schuldrad
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Needs verify+e2e rather than running standalone: pnpm status reruns every
  # check from scratch (by design — see scripts/status.mjs), so gating it on
  # the real verify/e2e jobs first avoids paying for that duplicate work on a
  # PR that's already broken, instead of racing it in parallel.
  status:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm status
      - run: git diff --exit-code docs/STATUS.json

  # Separate job: the npm advisory service has outages, and they must not hide
  # the state of the code checks. Still required for a green pipeline.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: schuldrad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name schuldrad -p 3000:3000 schuldrad:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          docker rm -f schuldrad
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: schuldrad:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0.24.2
        with:
          image: schuldrad:ci
          artifact-name: sbom.spdx.json
