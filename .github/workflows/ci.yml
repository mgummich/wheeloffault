name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Dependabot can't update image tags inside workflow files, so the tags are
  # read from files it does update: docker-compose.yml (Postgres/Redis) and
  # the lockfile's @playwright/test version (the Playwright container).
  images:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.read.outputs.postgres }}
      redis: ${{ steps.read.outputs.redis }}
      playwright: ${{ steps.read.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        run: |
          set -eu
          postgres=$(sed -n 's/^ *image: *\(postgres:.*\)/\1/p' docker-compose.yml)
          redis=$(sed -n 's/^ *image: *\(redis:.*\)/\1/p' docker-compose.yml)
          pw=$(grep -A2 "^      '@playwright/test':" pnpm-lock.yaml | sed -n 's/^ *version: //p')
          test -n "$postgres" && test -n "$redis" && test -n "$pw"
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"
          echo "redis=$redis" >> "$GITHUB_OUTPUT"
          echo "playwright=mcr.microsoft.com/playwright:v$pw-noble" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: images
    # Postgres/Redis service containers, same images as docker-compose.yml's
    # `overengineered` profile (read by the `images` job): real coverage for postgresEventStore.ts and
    # the Redis broadcast hub, which the SQLite-only unit tests can't reach.
    # Health-checked so `test:integration` never races a container that
    # hasn't finished starting. Extending `verify` rather than adding a new
    # job: it already runs `test:integration`, and the new Postgres/Redis
    # tests skip themselves via DATABASE_URL/REDIS_URL, so nothing but the
    # service block and two env vars needs to change.
    services:
      postgres:
        image: ${{ needs.images.outputs.postgres }}
        env:
          POSTGRES_DB: schuldrad
          POSTGRES_USER: schuldrad
          POSTGRES_PASSWORD: schuldrad
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ needs.images.outputs.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://schuldrad:schuldrad@localhost:5432/schuldrad
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist

  # Needs verify+e2e rather than running standalone: pnpm status reruns every
  # check from scratch (by design — see scripts/status.mjs), so gating it on
  # the real verify/e2e jobs first avoids paying for that duplicate work on a
  # PR that's already broken, instead of racing it in parallel.
  status:
    runs-on: ubuntu-latest
    # Same Playwright container as `e2e`: `pnpm status` reruns the E2E suite,
    # visual baselines included, so it needs the same font rendering.
    container: ${{ needs.images.outputs.playwright }}
    needs: [images, verify, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm status
      # The checkout runs as the runner user but the container's steps run as
      # root, so git rejects the workspace as dubiously owned and reports it
      # as "not a git repository" — checkout's own safe.directory entry lives
      # in a temporary HOME that is gone by now.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: git diff --exit-code docs/STATUS.json

  # Separate job: the npm advisory service has outages, and they must not hide
  # the state of the code checks. Still required for a green pipeline.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    # The visual baselines in tests/e2e/visual.spec.ts-snapshots are committed
    # with no pixel threshold, so the fonts here must match the ones they were
    # generated with: this image, pinned to the @playwright/test version.
    # A bare runner renders text a few hundred pixels differently and fails.
    container: ${{ needs.images.outputs.playwright }}
    needs: [images, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: schuldrad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name schuldrad -p 3000:3000 schuldrad:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          docker rm -f schuldrad
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: schuldrad:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: schuldrad:ci
          artifact-name: sbom.spdx.json
