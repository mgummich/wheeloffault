    - generic [ref=f6e425]:
      - heading "How a draw works" [level=2] [ref=f6e426]
      - list [ref=f6e427]:
        - listitem [ref=f6e428]: The server calculates the weights of all active participants per this policy.
        - listitem [ref=f6e429]: It generates a secret server seed and publishes SHA-256(seed, nonce, weights) as the commitment.
        - listitem [ref=f6e430]: The browser supplies a client seed the server did not know beforehand.
        - listitem [ref=f6e431]: HMAC-SHA-256(server seed, commitment:client seed:nonce) determines the point on the weight line.
        - listitem [ref=f6e432]: The result is stored, only then does the wheel spin. Every draw is recomputable in the browser.
